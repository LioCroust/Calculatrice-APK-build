kind = "mobile"
previewPath = "/"
title = "Calculatrice"
description = "Une calculatrice Android native, utilisable hors ligne, inspirée de la calculatrice Google en mode sombre. Elle prend en charge les opérations courantes, les décimales, les parenthèses et une suppression discrète par glissement avec restauration par secousse."
version = "1.0.0"
id = "artifacts/calculatrice"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22836

[services.development]
run = "pnpm --filter @workspace/calculatrice run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/calculatrice", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/calculatrice", "run", "serve" ]

[services.env]
PORT = "22836"
BASE_PATH = "/"
