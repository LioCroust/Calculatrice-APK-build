name: Build Calculatrice Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      NODE_ENV: production
      ANDROID_NDK_VERSION: 27.1.12297006
      ANDROID_CMAKE_VERSION: 3.22.1
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify RevenueCat Android key
        run: test -n "$EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY"

      - name: Test calculator operations
        run: pnpm --filter @workspace/calculatrice run test:math

      - name: Generate Android project
        working-directory: artifacts/calculatrice
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Configure Android upload signing
        working-directory: artifacts/calculatrice/android
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          KEYSTORE_FILE="$RUNNER_TEMP/calculatrice-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storetype JKS \
            -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" >/dev/null 2>&1
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle")
          source = gradle_file.read_text()
          marker = "    signingConfigs {\n        debug {"
          if marker not in source:
              raise SystemExit("Could not locate Android signingConfigs block.")
          replacement = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
                  }
                  debug {"""
          source = source.replace(marker, replacement, 1)

          marker = "    buildTypes {"
          if marker not in source:
              raise SystemExit("Could not locate Android buildTypes block.")
          head, build_types = source.split(marker, 1)
          old = "signingConfig signingConfigs.debug"
          if build_types.count(old) != 2:
              raise SystemExit("Expected debug and release signing references.")
          position = build_types.rfind(old)
          build_types = (
              build_types[:position]
              + build_types[position:].replace(
                  old, "signingConfig signingConfigs.release", 1
              )
          )
          gradle_file.write_text(head + marker + build_types)
          PY

      - name: Build release AAB
        working-directory: artifacts/calculatrice/android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          NINJA_NUM_JOBS: 2
        run: |
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease \
            --no-daemon \
            --max-workers=2 \
            --console=plain \
            -PreactNativeArchitectures=arm64-v8a

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-release-aab
          path: artifacts/calculatrice/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14