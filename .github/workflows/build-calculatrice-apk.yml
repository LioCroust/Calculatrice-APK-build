name: Build Calculatrice Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      NODE_ENV: production
      ANDROID_NDK_VERSION: 27.1.12297006
      ANDROID_CMAKE_VERSION: 3.22.1

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/calculatrice
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: artifacts/calculatrice/android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          NINJA_NUM_JOBS: 2
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --max-workers=2 \
            --console=plain \
            -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-preview-arm64
          path: artifacts/calculatrice/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
